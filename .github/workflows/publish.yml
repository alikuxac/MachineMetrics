name: Publish Mod

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Tag & Extract Release Info
        id: parse_release
        run: |
          # Release Tag Formats:
          # Release: v0.0.1+1.21.1-neoforge           --> mod_version: 0.0.1, mc_version: 1.21.1, loader: neoforge
          # Beta:    v0.0.1-beta.1+1.21.1-neoforge    --> mod_version: 0.0.1-beta.1, mc_version: 1.21.1, loader: neoforge
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_RAW="${TAG_NAME#v}"
          
          # Extract mod version before '+'
          MOD_VERSION="${VERSION_RAW%%+*}"

          # Extract metadata after '+' (e.g., 1.21.1-neoforge)
          META="${VERSION_RAW#*+}"
          MC_VERSION="${META%-*}"
          LOADER="${META##*-}"

          if [[ "${{ github.event.release.prerelease }}" == "true" ]] || [[ "$TAG_NAME" =~ (beta|alpha|rc) ]]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="release"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "loader=$LOADER" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod Jar
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod_version="${{ steps.parse_release.outputs.mod_version }}"

      - name: Publish Mod
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: 'hRT19d7o'
          curseforge-id: '1706910'

          name: 'machinemetrics-${{ steps.parse_release.outputs.mod_version }}+mc${{ steps.parse_release.outputs.mc_version }}-${{ steps.parse_release.outputs.loader }}.jar'
          version: '${{ steps.parse_release.outputs.tag_name }}'
          version-type: '${{ steps.parse_release.outputs.release_type }}'
          changelog: 'See release changes on GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ steps.parse_release.outputs.tag_name }}'

          loader: '${{ steps.parse_release.outputs.loader }}'
          game-versions: '${{ steps.parse_release.outputs.mc_version }}'
          java: 21

          files: |
            build/libs/!(*-sources|*-dev).jar