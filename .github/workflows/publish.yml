name: Publish Mod

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse Tag & Extract Release Info
        id: parse_release
        run: |
          # Release Tag Formats:
          # Release: v0.0.1+1.21.1            --> mod_version: 0.0.1, mc_version: 1.21.1
          # Beta:    v0.0.1-beta.1+1.21.1     --> mod_version: 0.0.1-beta.1, mc_version: 1.21.1
          TAG_NAME="${{ github.event.release.tag_name }}"
          VERSION_RAW="${TAG_NAME#v}"
          
          # Extract mod version before '+'
          MOD_VERSION="${VERSION_RAW%%+*}"

          # Extract mc_version after '+'
          MC_VERSION="${VERSION_RAW#*+}"

          if [[ "${{ github.event.release.prerelease }}" == "true" ]] || [[ "$TAG_NAME" =~ (beta|alpha|rc) ]]; then
            RELEASE_TYPE="beta"
          else
            RELEASE_TYPE="release"
          fi

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "mc_version=$MC_VERSION" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Mod Jar (NeoForge)
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmod_version="${{ steps.parse_release.outputs.mod_version }}"

      - name: Upload Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neoforge/build/libs/machinemetrics-*.jar
          tag_name: ${{ steps.parse_release.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish NeoForge Mod
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          modrinth-id: 'hRT19d7o'
          curseforge-id: '1706910'

          name: 'machinemetrics-${{ steps.parse_release.outputs.mod_version }}+mc${{ steps.parse_release.outputs.mc_version }}-neoforge.jar'
          version: '${{ steps.parse_release.outputs.tag_name }}-neoforge'
          version-type: '${{ steps.parse_release.outputs.release_type }}'
          changelog: 'See release changes on GitHub: https://github.com/${{ github.repository }}/releases/tag/${{ steps.parse_release.outputs.tag_name }}'

          loader: 'neoforge'
          game-versions: '${{ steps.parse_release.outputs.mc_version }}'
          java: 25

          files: |
            neoforge/build/libs/machinemetrics-*.jar
