plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = rootProject.mod_group_id
version = rootProject.mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
    withSourcesJar()
}

neoForge {
    version = rootProject.neo_version

    mods {
        "${rootProject.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly project(':mekanism-api-stub')
    compileOnly "org.appliedenergistics:appliedenergistics2:${rootProject.ae2_version}:api"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            loader_version_range: rootProject.loader_version_range,
            mod_version         : rootProject.mod_version,
            version             : rootProject.mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}
