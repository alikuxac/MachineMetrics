plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    }
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
        }

        server {
            workingDirectory project.file('run')
            args '--nogui'
            ideaModule "${rootProject.name}.${project.name}.main"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    compileOnly project(':common')
    compileOnly "mekanism:Mekanism:${rootProject.mekanism_version}:api"
    compileOnly "org.appliedenergistics:appliedenergistics2:${rootProject.ae2_version}:api"
}

tasks.named('jar', Jar) {
    archiveFileName = "${rootProject.mod_id}-${rootProject.mod_version}+mc${rootProject.minecraft_version}-forge.jar"
    from project(':common').sourceSets.main.output
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            forge_version          : rootProject.forge_version,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_version            : rootProject.mod_version,
            version                : rootProject.mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// ponytail: common has no Forge-mapped MC jars of its own; compile its sources against the Forge MC jar
tasks.named('compileJava').configure {
    dependsOn project(':common').tasks.named('classes')
}